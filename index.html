<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>나린학원</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#FBF7F0;--ink:#33393D;--line:#E4DFD4;--muted:#8A9089;
  --seal:#D9534F;--navy:#3D6B9E;--absent:#A6ACA5;--card:#fff;
  --warn:#FFF3E0;--ok:#3A9B6E;--accent:#F2B33D;
  --r:16px;--sh:0 3px 14px rgba(90,80,60,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh}
.jua,h1,h2,h3,.nm,.clock{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.5px}

/* ── 헤더 ── */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:20px 26px 16px}
header h1{font-size:27px;display:flex;align-items:center;gap:10px}
header h1 img.badge{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);object-fit:contain;padding:3px;background:#fff;box-shadow:var(--sh)}
.clock{font-size:26px;text-align:center}
.clock small{font-size:15px;color:var(--muted);margin-left:2px}
header .dateLbl{font-size:15px;color:var(--muted);text-align:right}

/* ── 탭 ── */
nav{display:flex;gap:6px;background:#F1ECE2;border-radius:999px;padding:6px;margin:0 auto 6px;width:min(600px,94%)}
nav button{flex:1;padding:12px 0;font-size:15px;background:none;border:none;cursor:pointer;color:var(--muted);border-radius:999px;font-family:'Gowun Dodum',sans-serif;transition:background .15s}
nav button.on{color:var(--ink);background:#fff;box-shadow:var(--sh);font-weight:600}
main{padding:20px 22px 70px;max-width:1060px;margin:0 auto}

/* ── 공통 카드 ── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:18px}
.card h3{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.hint{font-size:13.5px;color:var(--muted);margin:14px 4px;line-height:1.8}
.empty{padding:70px 0;text-align:center;color:var(--muted);font-size:15.5px;line-height:2}
.row{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;align-items:center}

/* ── 입력 ── */
input[type=text],input[type=month],input[type=time],input[type=password],input[type=email]{
  padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;
  font-family:inherit;background:#fff;color:var(--ink);outline-color:var(--accent)}
.btn{padding:10px 17px;border:none;background:var(--ink);color:#fff;border-radius:12px;font-size:14.5px;cursor:pointer;font-family:inherit;box-shadow:var(--sh)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:#fff;color:var(--seal);border:1.5px solid #EFC7C5;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.searchInp{width:min(320px,100%)}

/* ── 미등원 박스 ── */
.missBox{background:var(--warn);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;margin-bottom:22px;line-height:2;font-size:15.5px}
.missBox b{font-family:'Jua',sans-serif;font-size:17px}
.missOk{color:var(--ok);font-weight:600}
.missMiss{color:var(--seal);font-weight:700}
.missLater{color:var(--muted);font-size:13.5px}

/* ── 시간대 섹션 ── */
.slotSec{margin-bottom:28px}
.slotHead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;padding:0 2px}
.slotHead h2{font-size:21px}
.slotHead .cnt{font-size:14px;color:var(--muted)}

/* ── 학생 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.stu{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px 12px 30px;cursor:pointer;text-align:center;min-height:118px;
  transition:transform .1s;border:2px solid transparent}
.stu:active{transform:scale(.95)}
.stu .nm{font-size:21px;margin-bottom:8px}
.stu .st{font-size:13px;color:var(--muted);line-height:1.5}
.stu.notyet{border-color:#F0CFC5;background:#FFFBF8}
.stu.absent{background:#F0F1EE;box-shadow:none}
.stu.absent .nm{color:var(--absent);text-decoration:line-through}
.stu.extra{border-style:dashed;border-color:var(--line);background:#FCFBF7;box-shadow:none}
.seal{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;
  border:2.5px solid var(--seal);color:var(--seal);font-size:13px;
  display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;
  transform:rotate(-12deg);background:rgba(217,83,79,.07);animation:stamp .18s ease-out}
.seal.out{border-color:var(--navy);color:var(--navy);background:rgba(61,107,158,.07);right:50px;transform:rotate(8deg)}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.absBtn{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--muted);border:none;background:none;cursor:pointer;padding:5px 7px;font-family:inherit}
.absBtn:hover{color:var(--seal)}
.tagExtra{position:absolute;top:8px;left:10px;font-size:11px;color:var(--navy);background:rgba(61,107,158,.08);border-radius:999px;padding:3px 8px}

/* ── 학생 칩 ── */
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);
  border-radius:999px;padding:7px 10px 7px 15px;margin:4px 5px 4px 0;font-size:14.5px;background:#FDFCF9;cursor:pointer}
.chip small{color:var(--muted);font-size:12px}
.chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
.chip button:hover{color:var(--seal)}

/* ── 요일 시간 그리드 ── */
.schedGrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.schedGrid .dc{display:flex;flex-direction:column;align-items:center;gap:4px}
.schedGrid .dc small{font-size:13px;color:var(--muted)}
.schedGrid input[type=time]{width:108px;padding:8px 6px;font-size:13.5px}

/* ── 월간 표 ── */
.slotTabs{display:flex;gap:8px;flex-wrap:wrap}
.slotTabs button{padding:9px 20px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.slotTabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblWrap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:4px}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border:1px solid #EEE9DE;padding:7px 10px;text-align:center;white-space:nowrap}
th{background:#F7F4EC;font-weight:600}
td.p{color:var(--seal);font-weight:700;cursor:pointer}
td.a{color:var(--absent);cursor:pointer}
td.e{cursor:pointer}
td.p:hover,td.a:hover,td.e:hover{background:#FCF8EF}
tfoot td{background:#FAF8F2;font-weight:600}
.legend{font-size:13px;color:var(--muted);margin:10px 4px;line-height:1.8}
.clrTag{font-size:11px;color:#B8860B}

/* ── 잠금 ── */
.lock{max-width:350px;margin:70px auto;text-align:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:30px 26px}
.lock h2{font-size:22px;margin-bottom:14px}
.lock p{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.8}
.lock input{width:100%;text-align:center;letter-spacing:4px;margin-bottom:10px}
.lock .btn{width:100%}

/* ── 팝업 ── */
.ovl{position:fixed;inset:0;background:rgba(40,40,35,.45);display:flex;
  align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px 16px}
.modal{background:#fff;border-radius:var(--r);padding:24px 26px;width:min(400px,92vw);
  box-shadow:0 12px 44px rgba(0,0,0,.22);max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal p{font-size:15.5px;line-height:1.7;margin-bottom:14px}
.modal .mt{font-family:'Jua',sans-serif;font-size:19px;margin-bottom:14px}
.modal label{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:9px 0}
.modal label .lb{width:56px;color:var(--muted);flex-shrink:0}
.modal label input[type=time],.modal label input[type=text],.modal label input[type=password]{flex:1}
.modal input[type=checkbox]{width:18px;height:18px}
.modal .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.netDot{position:fixed;bottom:14px;right:16px;font-size:12px;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
.netDot.off{color:var(--seal);border-color:#EFC7C5}
</style>
</head>
<body>
<header>
  <h1><img class="badge" alt="나린학원" id="logoImg">나린학원</h1>
  <div class="clock" id="clock">--:--</div>
  <span class="dateLbl" id="todayLabel"></span>
</header>
<nav id="mainNav" style="display:none">
  <button class="on" data-v="today">오늘 출석</button>
  <button data-v="log">월간 기록 🔒</button>
  <button data-v="manage">학생 관리 🔒</button>
</nav>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div id="modalHost"></div>
<div class="netDot" id="netDot" style="display:none">● 실시간 연결됨</div>
<script>
/* ▼▼▼ Firebase 설정을 여기에 붙여넣으세요 ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyCxgrdpdRV32XSuOTGcKdDiJRfY04K6XmY",
  authDomain: "narinapp.firebaseapp.com",
  databaseURL: "https://narinapp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "narinapp",
  storageBucket: "narinapp.firebasestorage.app",
  messagingSenderId: "300427082858",
  appId: "1:300427082858:web:4ee893b29f70c880549e13",
  measurementId: "G-HCH96MTLZF"
};
/* ▲▲▲ */

/* ──────────────── 유틸 ──────────────── */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const DAYS=['일','월','화','수','목','금','토'];
function seoul(){
  const now=new Date();
  const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(now);
  const time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  const sec=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const wd=wdMap[new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(now)];
  return{date,time,sec,wd};
}
const todayStr=()=>seoul().date;
const nowTime=()=>seoul().time;
const monthKey=d=>'att-'+d.slice(0,7);
const hmToMin=hm=>{const p=String(hm||'0:0').split(':').map(Number);return p[0]*60+p[1];};
const fmtDays=days=>days.slice().sort().map(d=>DAYS[d]).join('');
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_STR='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung=s=>[...String(s)].map(ch=>{const c=ch.charCodeAt(0);
  return(c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:ch;}).join('');
function schedSummary(sc){
  const byT={};
  Object.keys(sc||{}).forEach(d=>{(byT[sc[d]]=byT[sc[d]]||[]).push(+d);});
  return Object.keys(byT).sort().map(t=>fmtDays(byT[t])+' '+t).join(' · ')||'자유';
}
function matchSt(st,q){
  if(!q)return true;
  if((st.name||'').includes(q))return true;
  if([...q].every(c=>CHO_STR.includes(c))&&chosung(st.name).includes(q))return true;
  if((st.school||'').includes(q))return true;
  if((st.grade||'').includes(q))return true;
  const dq=q.replace(/\D/g,'');
  if(dq&&(st.phone||'').includes(dq))return true;
  if(Object.values(st.sched||{}).some(t=>String(t).includes(q)))return true;
  return false;
}
function normTime(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){
    if(v>0&&v<1){const t=Math.round(v*24*60);return pad(Math.floor(t/60))+':'+pad(t%60);}
    if(v>=0&&v<=24)return pad(Math.floor(v))+':00';
  }
  let s=String(v).trim();
  if(/^\d{3,4}$/.test(s)){s=s.padStart(4,'0');return s.slice(0,2)+':'+s.slice(2);}
  const m=s.match(/^(\d{1,2}):(\d{2})/);if(m)return pad(+m[1])+':'+m[2];
  return null;
}

/* ──────────────── 상태 ──────────────── */
let db=null,roster={students:[]},attCache={},watched={};
let view='today',logMonth=todayStr().slice(0,7);
let adminUnlocked=false,showAllToday=false;
let todaySearch='',logSearch='';

/* ──────────────── 시계 ──────────────── */
setInterval(()=>{const s=seoul();$('#clock').innerHTML=s.sec.slice(0,5)+'<small>:'+s.sec.slice(6)+'</small>';},1000);

/* ──────────────── 팝업 ──────────────── */
function uiConfirm(msg){return new Promise(res=>{
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal"><p>${msg}</p>
    <div class="mrow"><button class="btn ghost" id="mNo">취소</button><button class="btn" id="mYes">확인</button></div></div></div>`;
  $('#mYes').onclick=()=>{$('#modalHost').innerHTML='';res(true);};
  $('#mNo').onclick=()=>{$('#modalHost').innerHTML='';res(false);};
});}
function uiAlert(msg){return new Promise(res=>{
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal"><p>${msg}</p>
    <div class="mrow"><button class="btn" id="mOk">확인</button></div></div></div>`;
  $('#mOk').onclick=()=>{$('#modalHost').innerHTML='';res();};
});}

/* ──────────────── Firebase 시작 ──────────────── */
function startApp(){
  if(firebaseConfig.apiKey.includes('여기에')){
    $('#main').innerHTML='<div class="lock"><h2>설정 필요</h2><p>index.html 안의 <b>firebaseConfig</b>에 Firebase 콘솔 설정을 붙여넣어 주세요.</p></div>';
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){renderLogin();return;}
    $('#mainNav').style.display='flex';
    $('#netDot').style.display='block';
    db.ref('.info/connected').on('value',s=>{
      const on=!!s.val();
      $('#netDot').textContent=on?'● 실시간 연결됨':'● 오프라인 — 저장 안 됨';
      $('#netDot').classList.toggle('off',!on);
    });
    let migrating=false;
    db.ref('data/roster2').on('value',snap=>{
      const v=snap.val();
      let r=v?JSON.parse(v):{students:[]};
      if(r.slots){r=migrateRoster(r);
        if(!migrating){migrating=true;db.ref('data/roster2').set(JSON.stringify(r)).finally(()=>migrating=false);}
      }
      if(!r.students)r.students=[];
      roster=r;
      if(view==='today')drawToday();
    });
    watchMonth(monthKey(todayStr()));
    render();
  });
}
function migrateRoster(old){
  const students=[];
  (old.slots||[]).forEach(sl=>(sl.students||[]).forEach(st=>{
    const sched={};
    (st.days||[]).forEach(d=>{sched[d]=(sl.timeByDay&&sl.timeByDay[d])||sl.time||'19:00';});
    const ns={id:st.id,name:st.name,sched};
    if(st.school)ns.school=st.school;
    if(st.grade)ns.grade=st.grade;
    if(st.phone)ns.phone=st.phone;
    students.push(ns);
  }));
  return{students};
}
function renderLogin(){
  $('#mainNav').style.display='none';
  $('#main').innerHTML=`<div class="lock"><h2>학원 계정 로그인</h2>
    <p>처음 한 번만 로그인하면 이 기기에서는 계속 로그인 상태가 유지됩니다.</p>
    <input type="email" id="lgEmail" placeholder="학원 이메일">
    <input type="password" id="lgPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">로그인</button></div>`;
}
async function doLogin(){
  try{await firebase.auth().signInWithEmailAndPassword($('#lgEmail').value.trim(),$('#lgPw').value);}
  catch(e){uiAlert('로그인에 실패했습니다.<br><small style="color:var(--muted)">이메일과 비밀번호를 확인해 주세요.</small>');}
}

/* ──────────────── 데이터 ──────────────── */
function watchMonth(mk){
  if(watched[mk])return; watched[mk]=true;
  db.ref('data/'+mk).on('value',snap=>{
    attCache[mk]=snap.val()||{};
    if(view==='today'&&mk===monthKey(todayStr()))drawToday();
  });
}
async function fetchMonth(mk){
  if(attCache[mk]!==undefined&&watched[mk])return attCache[mk];
  const snap=await db.ref('data/'+mk).get();
  attCache[mk]=snap.val()||{};return attCache[mk];
}
async function saveRoster(){
  try{await db.ref('data/roster2').set(JSON.stringify(roster));}
  catch(e){uiAlert('저장에 실패했습니다.');}
}
async function applyRec(ds,sid,rec){
  const mk=monthKey(ds);
  const c=attCache[mk]=attCache[mk]||{};c[ds]=c[ds]||{};
  if(rec===null){delete c[ds][sid];if(!Object.keys(c[ds]).length)delete c[ds];}
  else c[ds][sid]=rec;
  if(view==='today')drawToday();
  try{
    const ref=db.ref('data/'+mk+'/'+ds+'/'+sid);
    if(rec===null)await ref.remove();else await ref.set(rec);
  }catch(e){uiAlert('저장에 실패했습니다.');}
}
const findSt=sid=>roster.students.find(s=>s.id===sid);

/* ──────────────── 오늘 출석 ──────────────── */
function todayGroups(wd){
  const g={};
  roster.students.forEach(st=>{const t=(st.sched||{})[wd];if(t)(g[t]=g[t]||[]).push(st);});
  return Object.keys(g).sort().map(t=>({time:t,students:g[t].sort((a,b)=>a.name.localeCompare(b.name,'ko'))}));
}
function drawToday(){
  if(view!=='today')return;
  const m=$('#main');
  if(!roster.students.length){
    m.innerHTML='<div class="empty">아직 등록된 학생이 없습니다.<br>「학생 관리」에서 학생을 추가해 주세요.</div>';return;
  }
  const s=seoul(),date=s.date,wd=s.wd,nowMin=hmToMin(s.time);
  const day=(attCache[monthKey(date)]||{})[date]||{};
  const groups=todayGroups(wd);
  const extras=roster.students.filter(st=>!(st.sched||{})[wd]).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const esc=(todaySearch||'').replace(/"/g,'&quot;');

  /* 미등원 현황 */
  const started=groups.filter(g=>{const dm=nowMin-hmToMin(g.time);return dm>=0&&dm<=60;});
  let miss=`<div class="missBox"><b>📋 미등원 현황</b> <small style="color:var(--muted)">(정규 시간 기준 · 현재 시간 앞뒤 1시간)</small><br>`;
  if(!started.length){miss+='<span class="missLater">최근 1시간 안에 시작한 수업이 없습니다. 수업 시간이 지나면 여기에 표시됩니다.</span><br>';}
  else{
    started.forEach(g=>{
      const not=g.students.filter(st=>{const r=day[st.id]||{};return !r.in&&r.status!=='a';});
      miss+=g.time+' — '+(not.length?`<span class="missMiss">${not.map(st=>st.name).join(', ')}</span>`:'<span class="missOk">전원 등원 ✓</span>')+'<br>';
    });
  }
  const pending=groups.filter(g=>{const dm=hmToMin(g.time)-nowMin;return dm>0&&dm<=60;});
  if(pending.length)miss+=`<span class="missLater">${pending.map(g=>g.time).join(', ')} 수업 시작 전</span><br>`;
  miss+='</div>';

  /* 검색바 */
  const bar=`<div class="row" style="margin-top:0">
    <input type="text" class="searchInp" placeholder="🔍 이름·초성·학교·학년·번호·시간 검색" value="${esc}"
      oninput="todaySearch=this.value;filterCards()">
    <button class="btn ${showAllToday?'':'ghost'}" onclick="toggleAll()">${showAllToday?'👁 전체 보기 해제':'👁 관리자 전체 보기'}</button>
  </div>`;
  const noneNow='<div class="empty" id="noneNow" style="display:none">지금은 출석 체크 시간대가 아닙니다.<br>검색으로 학생을 찾아 등원·하원을 기록하세요.<br>정규 시간 외 출석은 자동으로 「보강」으로 저장됩니다.</div>';

  /* 카드 생성 */
  const mkCard=(st,isReg,tGroup)=>{
    const rec=day[st.id]||{};
    const win=isReg?Math.abs(nowMin-hmToMin(tGroup))<=15:false;
    let cls='stu',seals='',txt=isReg?'탭하여 등원 기록':'정규 시간 외 — 탭하면 보강 등원';
    const boTag=(!isReg||rec.mk)?'<span class="tagExtra">보강</span>':'';
    if(rec.status==='a'){cls+=' absent';txt='결석'+(rec.reason?'<br>'+rec.reason:'');}
    else if(rec.out){seals='<span class="seal">출석</span><span class="seal out">하원</span>';txt='등원 '+rec.in+' · 하원 '+rec.out;}
    else if(rec.in){seals='<span class="seal">출석</span>';txt='등원 '+rec.in+'<br>탭하면 하원 기록';}
    else if(isReg)cls+=' notyet';
    else cls+=' extra';
    const times=Object.values(st.sched||{}).join(',');
    return `<div class="stu ${cls.replace('stu ','')}" data-nm="${st.name}" data-cho="${chosung(st.name)}"
      data-sc="${st.school||''}" data-gr="${st.grade||''}" data-ph="${st.phone||''}"
      data-times="${times}" data-win="${win?1:0}" onclick="tapSt('${st.id}')">${boTag}${seals}
      <div class="nm">${st.name}</div><div class="st">${txt}</div>
      ${isReg?`<button class="absBtn" onclick="event.stopPropagation();doAbsent('${st.id}')">${rec.status==='a'?'결석 취소':'결석'}</button>`:''}
    </div>`;
  };

  let html=bar+miss+noneNow;
  groups.forEach(g=>{
    const arr=g.students.filter(st=>(day[st.id]||{}).in).length;
    html+=`<section class="slotSec"><div class="slotHead"><h2>${g.time}</h2>
      <span class="cnt">정규 ${arr}/${g.students.length} 등원</span></div>
      <div class="grid">${g.students.map(st=>mkCard(st,true,g.time)).join('')}</div></section>`;
  });
  if(extras.length){
    const arr=extras.filter(st=>(day[st.id]||{}).in).length;
    html+=`<section class="slotSec"><div class="slotHead"><h2>보강·시간 외</h2>
      <span class="cnt">오늘 정규 없음 · ${arr}명 등원</span></div>
      <div class="grid">${extras.map(st=>mkCard(st,false,null)).join('')}</div></section>`;
  }
  html+='<p class="hint">카드는 본인 수업 시간 <b>앞뒤 15분</b> 동안 나타나며, 그 외에는 검색으로 찾아 기록합니다. 정규 시간 외 출석은 「보강」으로 표시됩니다.</p>';
  m.innerHTML=html;
  filterCards();
}
function renderToday(){watchMonth(monthKey(todayStr()));drawToday();}
function cardMatch(el,q){
  if((el.dataset.nm||'').includes(q))return true;
  if([...q].every(c=>CHO_STR.includes(c))&&(el.dataset.cho||'').includes(q))return true;
  if((el.dataset.sc||'')&&el.dataset.sc.includes(q))return true;
  if((el.dataset.gr||'')&&el.dataset.gr.includes(q))return true;
  const dq=q.replace(/\D/g,'');if(dq&&(el.dataset.ph||'').includes(dq))return true;
  if((el.dataset.times||'').includes(q))return true;
  return false;
}
function filterCards(){
  const q=(todaySearch||'').trim();
  document.querySelectorAll('#main .stu').forEach(el=>{
    el.style.display=(q?cardMatch(el,q):(showAllToday||el.dataset.win==='1'))?'':'none';
  });
  let anyVis=false;
  document.querySelectorAll('#main .slotSec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.stu')].some(el=>el.style.display!=='none');
    sec.style.display=any?'':'none';if(any)anyVis=true;
  });
  const nn=$('#noneNow');if(nn)nn.style.display=anyVis?'none':'';
}
async function tapSt(sid){
  const st=findSt(sid);if(!st)return;
  const s=seoul(),date=s.date,isReg=!!(st.sched||{})[s.wd];
  const rec=((attCache[monthKey(date)]||{})[date]||{})[sid]||{};
  if(rec.status==='a')return;
  if(!rec.in){const nr={in:nowTime()};if(!isReg)nr.mk=true;if(rec.cleared)nr.cleared=true;applyRec(date,sid,nr);}
  else if(!rec.out)applyRec(date,sid,{...rec,out:nowTime()});
  else if(await uiConfirm('이 학생의 오늘 기록을 지울까요?'))applyRec(date,sid,{cleared:true});
}
async function doAbsent(sid){
  const date=todayStr();
  const rec=((attCache[monthKey(date)]||{})[date]||{})[sid]||{};
  if(rec.status==='a'){applyRec(date,sid,rec.cleared?{cleared:true}:null);return;}
  const st=findSt(sid);
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal"><div class="mt">${st?st.name:''} 결석 처리</div>
    <input type="text" id="absRs" placeholder="결석 사유 (선택, 예: 감기)" style="width:100%"
      onkeydown="if(event.key==='Enter')$('#absOk').click()">
    <div class="mrow"><button class="btn ghost" id="absNo">취소</button>
    <button class="btn" id="absOk">결석 처리</button></div></div></div>`;
  setTimeout(()=>$('#absRs')&&$('#absRs').focus(),50);
  $('#absNo').onclick=()=>$('#modalHost').innerHTML='';
  $('#absOk').onclick=()=>{
    const nr={status:'a'};
    const rs=$('#absRs').value.trim();if(rs)nr.reason=rs;
    if(rec.cleared)nr.cleared=true;
    $('#modalHost').innerHTML='';applyRec(date,sid,nr);
  };
}

async function renderLog(){
  if(!adminUnlocked){renderLock();return;}
  const m=$('#main');
  if(!roster.students.length){m.innerHTML='<div class="empty">등록된 학생이 없습니다.</div>';return;}
  const esc=(logSearch||'').replace(/"/g,'&quot;');
  m.innerHTML=`<div class="row">
    <input type="month" value="${logMonth}" onchange="logMonth=this.value;buildLog()">
    <button class="btn ghost" onclick="exportCSV()">CSV 내보내기</button>
    <button class="btn ghost" onclick="changePin()">비밀번호 변경</button>
    <button class="btn ghost" onclick="doLogout()">계정 로그아웃</button>
  </div>
  <div class="row">
    <input type="text" class="searchInp" placeholder="🔍 이름·초성·학교·학년·번호·시간 검색" value="${esc}"
      oninput="logSearch=this.value;buildLog()">
  </div>
  <div id="logWrap"></div>`;
  await fetchMonth('att-'+logMonth);
  buildLog();
}
function buildLog(){
  const wrap=$('#logWrap');if(!wrap)return;
  const q=(logSearch||'').trim();
  const cols=roster.students.filter(st=>matchSt(st,q)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const att=attCache['att-'+logMonth]||{};
  if(!cols.length){wrap.innerHTML='<div class="empty">검색된 학생이 없습니다.</div>';return;}
  const[y,mo]=logMonth.split('-').map(Number);
  const dim=new Date(y,mo,0).getDate();
  const dates=[];
  for(let d=1;d<=dim;d++){const ds=logMonth+'-'+pad(d);if(att[ds]&&cols.some(st=>att[ds][st.id]))dates.push(ds);}
  if(!dates.length){wrap.innerHTML='<div class="empty">이 달에는 기록이 없습니다.</div>';return;}
  let tbl=`<div class="tblWrap"><table><thead><tr><th>날짜</th>
    ${cols.map(st=>`<th>${st.name}${st.grade?'<br><small style="color:var(--muted);font-weight:400">'+st.grade+'</small>':''}</th>`).join('')}
  </tr></thead><tbody>`;
  const cnt={};
  dates.forEach(ds=>{
    const day=att[ds]||{},wd=DAYS[new Date(ds+'T12:00:00').getDay()];
    tbl+=`<tr><th>${ds.slice(5).replace('-','/')}<br><small style="font-weight:400;color:var(--muted)">${wd}</small></th>`
      +cols.map(st=>{
        const r=day[st.id];const cl=`onclick="editRec('${ds}','${st.id}')"`;
        const clr=r&&r.cleared?'<span class="clrTag"> ✂</span>':'';
        if(!r)return`<td class="e" ${cl}></td>`;
        if(r.status==='a')return`<td class="a" ${cl} title="${r.reason||''}">✕${clr}</td>`;
        if(r.in){cnt[st.id]=(cnt[st.id]||0)+1;
          const bk=r.mk?'<br><span style="font-size:10px;color:var(--navy)">보강</span>':'';
          return`<td class="p" ${cl} title="${r.in}${r.out?' ~ '+r.out:''}">○${bk}${clr}</td>`;}
        return`<td class="e" ${cl}>${r.cleared?'<span class="clrTag">✂</span>':''}</td>`;
      }).join('')+'</tr>';
  });
  tbl+=`</tbody><tfoot><tr><td>출석</td>${cols.map(st=>`<td>${cnt[st.id]||0}</td>`).join('')}</tr></tfoot></table></div>`;
  tbl+=`<p class="legend">○ 출석 · ✕ 결석 · <span style="color:var(--navy);font-size:11px">보강</span> 정규 외 등원 · <span class="clrTag">✂</span> 지움기록<br>칸을 누르면 수정할 수 있습니다.</p>`;
  wrap.innerHTML=tbl;
}
function editRec(ds,sid){
  const st=findSt(sid);if(!st)return;
  const r=((attCache['att-'+ds.slice(0,7)]||{})[ds]||{})[sid]||{};
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal">
    <div class="mt">${st.name} · ${ds.slice(5).replace('-','/')}</div>
    <label><span class="lb">등원</span><input type="time" id="edIn" value="${r.in||''}"></label>
    <label><span class="lb">하원</span><input type="time" id="edOut" value="${r.out||''}"></label>
    <label><input type="checkbox" id="edMk" ${r.mk?'checked':''}> 보강 (정규 외 등원)</label>
    <label><input type="checkbox" id="edAbs" ${r.status==='a'?'checked':''}> 결석 처리</label>
    <label><span class="lb">사유</span><input type="text" id="edRs" value="${r.reason||''}" placeholder="결석 사유 (선택)"></label>
    <label><input type="checkbox" id="edClr" ${r.cleared?'checked':''}> ✂ 지움기록 표시 (학생이 기록을 지운 흔적)</label>
    <div class="mrow">
      <button class="btn danger" id="edDel">완전 삭제</button>
      <button class="btn ghost" id="edNo">취소</button>
      <button class="btn" id="edOk">저장</button>
    </div></div></div>`;
  $('#edNo').onclick=()=>$('#modalHost').innerHTML='';
  $('#edDel').onclick=async()=>{
    if(await uiConfirm('이 날짜의 기록을 흔적 없이 완전히 삭제할까요?')){$('#modalHost').innerHTML='';await applyRec(ds,sid,null);buildLog();}
  };
  $('#edOk').onclick=async()=>{
    const nr={};
    if($('#edAbs').checked){nr.status='a';const rs=$('#edRs').value.trim();if(rs)nr.reason=rs;}
    else{
      const i=$('#edIn').value,o=$('#edOut').value;if(i)nr.in=i;
      if(o){if(!i){uiAlert('등원 시간을 먼저 넣어 주세요.');return;}nr.out=o;}
      if($('#edMk').checked&&nr.in)nr.mk=true;
    }
    if($('#edClr').checked)nr.cleared=true;
    $('#modalHost').innerHTML='';await applyRec(ds,sid,Object.keys(nr).length?nr:null);buildLog();
  };
}

/* ──────────────── 엑셀 내보내기 (ExcelJS — 틀 고정 지원) ──────────────── */
async function exportCSV(){
  const q=(logSearch||'').trim();
  const cols=roster.students.filter(st=>matchSt(st,q)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const att=await fetchMonth('att-'+logMonth);
  const[y,mo]=logMonth.split('-').map(Number);
  const dim=new Date(y,mo,0).getDate();
  const allDates=[];
  for(let d=1;d<=dim;d++){const ds=logMonth+'-'+pad(d);if(att[ds]&&cols.some(st=>att[ds][st.id]))allDates.push(ds);}

  const wb=new ExcelJS.Workbook();
  wb.creator='나린학원';wb.created=new Date();

  /* ── 공통: 너비 계산 ── */
  function wch(str){return Math.min(40,Math.max(8,[...String(str||'')].reduce((s,c)=>s+(c.charCodeAt(0)>127?2:1),0)));}

  /* ════════ 시트 1: 일별 출석 ════════ */
  const ws1=wb.addWorksheet('일별 출석');
  const HDR_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F4EC'}};
  const HDR_FONT={bold:true,size:11};
  const BORDER={style:'thin',color:{argb:'FFEEE9DE'}};
  const BD={top:BORDER,left:BORDER,bottom:BORDER,right:BORDER};

  /* 1행: 학생 이름 (4열씩 병합) */
  const nameRow=['날짜','요일',...cols.flatMap(st=>[st.name,'','',''])];
  const r1=ws1.addRow(nameRow);
  r1.eachCell(c=>{c.fill=HDR_FILL;c.font=HDR_FONT;c.border=BD;c.alignment={horizontal:'center',vertical:'middle'};});
  cols.forEach((st,i)=>{
    const start=3+i*4,end=start+3;
    ws1.mergeCells(1,start,1,end);
  });
  r1.height=22;

  /* 2행: 등원/하원/구분/사유 */
  const subHdr=['날짜','요일',...cols.flatMap(()=>['등원','하원','구분','사유'])];
  const r2=ws1.addRow(subHdr);
  r2.eachCell(c=>{c.fill=HDR_FILL;c.font={bold:true,size:10};c.border=BD;c.alignment={horizontal:'center',vertical:'middle'};});
  ws1.mergeCells(1,1,2,1);ws1.mergeCells(1,2,2,2);  // 날짜·요일 1~2행 병합
  r2.height=20;

  /* 틀 고정: 2행·2열 */
  ws1.views=[{state:'frozen',xSplit:2,ySplit:2,activeCell:'C3'}];

  /* 열 너비 */
  ws1.getColumn(1).width=10;ws1.getColumn(2).width=5;
  cols.forEach((st,i)=>{
    [0,1].forEach(j=>{ws1.getColumn(3+i*4+j).width=8;});
    ws1.getColumn(3+i*4+2).width=7;
    ws1.getColumn(3+i*4+3).width=Math.max(8,wch(st.name)+2);
  });

  /* 데이터 행 */
  const ABSENT_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F1EE'}};
  const MK_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F0FA'}};
  allDates.forEach(ds=>{
    const day=att[ds]||{},wd=DAYS[new Date(ds+'T12:00:00').getDay()];
    const rowData=[ds.slice(5).replace('-','/'),wd];
    cols.forEach(st=>{
      const r=day[st.id];
      if(!r){rowData.push('','','','');return;}
      if(r.status==='a'){rowData.push('','','결석',r.reason||'');return;}
      rowData.push(r.in||'',r.out||'',r.mk?'보강':'정규',r.cleared?'(지움기록)':'');
    });
    const dr=ws1.addRow(rowData);
    dr.eachCell(c=>{c.border=BD;c.alignment={horizontal:'center',vertical:'middle'};});
    /* 날짜·요일 셀 스타일 */
    dr.getCell(1).font={bold:true};dr.getCell(2).font={color:{argb:'FF8A9089'}};
    /* 결석·보강 배경 */
    cols.forEach((st,i)=>{
      const r=day[st.id];if(!r)return;
      const base=3+i*4;
      if(r.status==='a')[0,1,2,3].forEach(j=>{dr.getCell(base+j).fill=ABSENT_FILL;});
      else if(r.mk)[0,1,2,3].forEach(j=>{dr.getCell(base+j).fill=MK_FILL;});
    });
    dr.height=18;
  });

  /* ════════ 시트 2: 학생별 집계 ════════ */
  const ws2=wb.addWorksheet('학생별 집계');
  const hdr2=['이름','학교','학년','정규 출석','보강 출석','결석','기록 없는 수업일'];
  const rh2=ws2.addRow(hdr2);
  rh2.eachCell(c=>{c.fill=HDR_FILL;c.font=HDR_FONT;c.border=BD;c.alignment={horizontal:'center',vertical:'middle'};});
  rh2.height=22;
  ws2.views=[{state:'frozen',xSplit:1,ySplit:1,activeCell:'B2'}];
  const w2=[14,14,8,10,10,8,14];hdr2.forEach((_,i)=>ws2.getColumn(i+1).width=w2[i]);

  const allDs2=[];
  for(let d=1;d<=dim;d++){const ds=logMonth+'-'+pad(d);if(att[ds])allDs2.push(ds);}
  const NUM_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF3E0'}};
  cols.forEach(st=>{
    let reg=0,mk=0,abs=0,none=0;
    allDs2.forEach(ds=>{
      const wd=new Date(ds+'T12:00:00').getDay(),isSchDay=!!(st.sched||{})[wd];
      const r=(att[ds]||{})[st.id];
      if(!r){if(isSchDay)none++;return;}
      if(r.status==='a')abs++;else if(r.in&&r.mk)mk++;else if(r.in)reg++;
    });
    const dr2=ws2.addRow([st.name,st.school||'',st.grade||'',reg,mk,abs,none]);
    dr2.eachCell(c=>{c.border=BD;c.alignment={horizontal:'center',vertical:'middle'};});
    dr2.getCell(1).alignment={horizontal:'left',vertical:'middle'};
    dr2.getCell(1).font={bold:true};
    [4,5,6,7].forEach(i=>{dr2.getCell(i).fill=NUM_FILL;});
    dr2.height=18;
  });

  /* ── 파일 저장 ── */
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='나린학원출석부_'+logMonth+'.xlsx';
  a.click();
}

function schedInputs(pfx,sc){
  return `<div class="schedGrid">${[1,2,3,4,5,6,0].map(d=>`
    <div class="dc"><small>${DAYS[d]}요일</small>
      <input type="time" id="${pfx}-${d}" value="${(sc&&sc[d])||''}"></div>`).join('')}</div>`;
}
function readSched(pfx){
  const sc={};
  [1,2,3,4,5,6,0].forEach(d=>{const v=$(`#${pfx}-${d}`);if(v&&v.value)sc[d]=v.value;});
  return sc;
}

async function addSts(){
  const names=($('#nsName').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!names.length){uiAlert('이름을 입력해 주세요.');return;}
  const school=($('#nsSchool').value||'').trim();
  const grade=($('#nsGrade').value||'').trim();
  const phone=($('#nsPhone').value||'').replace(/\D/g,'');
  const sched=readSched('ns');
  names.forEach((n,i)=>{
    const st={id:'s'+Date.now()+'_'+i,name:n,sched:{...sched}};
    if(school)st.school=school;if(grade)st.grade=grade;if(phone)st.phone=phone;
    roster.students.push(st);
  });
  await saveRoster();renderManage();
}
function editSt(sid){
  const st=findSt(sid);if(!st)return;
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal" style="width:min(580px,94vw)">
    <div class="mt">학생 정보 수정</div>
    <label><span class="lb">이름</span><input type="text" id="esNm" value="${st.name}"></label>
    <label><span class="lb">학교</span><input type="text" id="esSc" value="${st.school||''}" placeholder="선택"></label>
    <label><span class="lb">학년</span><input type="text" id="esGr" value="${st.grade||''}" placeholder="선택"></label>
    <label><span class="lb">뒷번호</span><input type="text" id="esPh" value="${st.phone||''}" inputmode="numeric" placeholder="선택"></label>
    <p style="font-size:13px;color:var(--muted);margin:12px 0 4px"><b>요일별 수업 시간</b> — 수업 없는 요일은 비워 두세요</p>
    ${schedInputs('est',st.sched)}
    <div class="mrow"><button class="btn ghost" id="esNo">취소</button><button class="btn" id="esOk">저장</button></div>
  </div></div>`;
  $('#esNo').onclick=()=>$('#modalHost').innerHTML='';
  $('#esOk').onclick=async()=>{
    const nm=$('#esNm').value.trim();if(!nm){uiAlert('이름을 입력해 주세요.');return;}
    st.name=nm;
    const sc=$('#esSc').value.trim();if(sc)st.school=sc;else delete st.school;
    const gr=$('#esGr').value.trim();if(gr)st.grade=gr;else delete st.grade;
    const ph=$('#esPh').value.replace(/\D/g,'');if(ph)st.phone=ph;else delete st.phone;
    st.sched=readSched('est');
    $('#modalHost').innerHTML='';await saveRoster();renderManage();
  };
}
async function delSt(sid){
  const st=findSt(sid);if(!st)return;
  if(!await uiConfirm('「'+st.name+'」 학생을 삭제할까요?<br><small style="color:var(--muted)">지난 출석 기록 자체는 남습니다.</small>'))return;
  roster.students=roster.students.filter(s=>s.id!==sid);await saveRoster();renderManage();
}
async function bulkDel(){
  const inp=$('#bulkDel');if(!inp)return;
  const names=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!names.length){uiAlert('삭제할 이름을 입력해 주세요.');return;}
  const hits=[],nf=[];
  names.forEach(nm=>{
    const f=roster.students.filter(st=>st.name===nm);
    if(f.length)hits.push(...f);else nf.push(nm);
  });
  if(!hits.length){uiAlert('해당 학생을 찾지 못했습니다.'+(nf.length?'<br><small>'+nf.join(', ')+'</small>':''));return;}
  const list=hits.map(st=>st.name+' <small style="color:var(--muted)">('+schedSummary(st.sched)+(st.school?' · '+st.school:'')+')</small>').join('<br>');
  if(!await uiConfirm('<b>'+hits.length+'명</b>을 삭제할까요?<br><br>'+list+(nf.length?'<br><br><small style="color:var(--muted)">못 찾음: '+nf.join(', ')+'</small>':'')+'<br><small style="color:var(--muted)">지난 기록은 남습니다.</small>'))return;
  const ids=new Set(hits.map(st=>st.id));
  roster.students=roster.students.filter(st=>!ids.has(st.id));
  inp.value='';await saveRoster();renderManage();
  uiAlert(hits.length+'명을 삭제했습니다.');
}

  const sample=[
    ['김민준','가양중','중1','1234','19:00','','19:00','','19:00','',''],
    ['이서연','가양중','중1','5678','','19:00','','19:00','','',''],
    ['박도현','나린고','고1','9012','','','','','19:30','14:00','']
  ];
  sample.forEach(r=>{const dr=ws.addRow(r);dr.eachCell(c=>{c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};c.alignment={horizontal:'center'};});});
  const widths=[12,12,8,12,8,8,8,8,8,8,8];HDR.forEach((_,i)=>ws.getColumn(i+1).width=widths[i]);

}
async function importExcel(){
  const f=$('#xlsFile')&&$('#xlsFile').files[0];
  if(!f){uiAlert('먼저 엑셀 파일을 선택해 주세요.');return;}
  let rows;
  try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf);rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
  catch(e){uiAlert('파일을 읽지 못했습니다. .xlsx 또는 .csv 형식인지 확인해 주세요.');return;}
  if(!rows.length){uiAlert('데이터가 없습니다.');return;}
  const dayK={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
  let added=0,skipped=0,saved=0;const errs=[];
  rows.forEach((r,i)=>{
    const name=String(r['이름']||'').trim();if(!name)return;
    // 동명이인 구별: 이름 + 학교 + 학년이 모두 일치해야 같은 학생으로 봄
    // 학교·학년이 둘 다 비어 있으면 이름만으로 판단 (정보가 없어 구별 불가)
    const sc_new=String(r['학교']||'').trim();
    const gr_new=String(r['학년']||'').trim();
    const ph_new=String(r['뒷번호']||'').replace(/\D/g,'');
    // 새 시간표 파싱 (엑셀에 있는 요일 칸만)
    const newSched={};
    const hasAnyTime=Object.keys(dayK).some(k=>normTime(r[k]));
    Object.keys(dayK).forEach(k=>{const t=normTime(r[k]);if(t)newSched[dayK[k]]=t;});

    // 동명이인 구별: 이름+학교+학년 조합
    const exist=roster.students.find(s=>{
      if(s.name!==name)return false;
      const noInfoBoth=(!sc_new&&!gr_new)&&(!s.school&&!s.grade);
      if(noInfoBoth)return true;
      const scMatch=sc_new&&s.school?sc_new===s.school:(!sc_new&&!s.school);
      const grMatch=gr_new&&s.grade?gr_new===s.grade:(!gr_new&&!s.grade);
      return scMatch&&grMatch;
    });
    if(exist){
      // 최신 엑셀 데이터로 덮어쓰기
      // 학교·학년·뒷번호: 엑셀에 값이 있으면 덮어쓰고, 없으면 기존 유지
      if(sc_new)exist.school=sc_new; 
      if(gr_new)exist.grade=gr_new;
      if(ph_new)exist.phone=ph_new;
      // 시간표: 엑셀에 요일 값이 하나라도 있으면 통째로 교체 (월수→화목 이동 대응)
      //         엑셀에 요일 값이 하나도 없으면 기존 시간표 유지
      if(hasAnyTime)exist.sched=newSched;
      saved++;
      return;
    }
    // 동명이인 경고
    const sameName=roster.students.filter(s=>s.name===name);
    if(sameName.length>0)errs.push((i+2)+'행 '+name+': 동명이인으로 판단해 새 학생으로 추가 (학교: '+sc_new+' · 학년: '+gr_new+')');
    const sched={};
    Object.keys(dayK).forEach(k=>{const t=normTime(r[k]);if(t)sched[dayK[k]]=t;
      else if(r[k]!==''&&r[k]!=null&&String(r[k]).trim()!=='')errs.push((i+2)+'행 '+k+'요일 형식 오류');});
    const st={id:'s'+Date.now()+'_'+i,name,sched};
    const sc=String(r['학교']||'').trim();if(sc)st.school=sc;
    const gr=String(r['학년']||'').trim();if(gr)st.grade=gr;
    const ph=String(r['뒷번호']||'').replace(/\D/g,'');if(ph)st.phone=ph;
    roster.students.push(st);added++;
  });
  if(added){await saveRoster();renderManage();}
  uiAlert('등록 완료: '+added+'명 추가'+(saved?'<br>기존 학생 정보 보강: '+saved+'명':'')+(skipped?'<br>변경 없음(중복): '+skipped+'명':'')
    +(errs.length?'<br><small style="color:var(--muted)">'+errs.slice(0,5).join('<br>')+(errs.length>5?'<br>외 '+(errs.length-5)+'건':'')+'</small>':''));
}
