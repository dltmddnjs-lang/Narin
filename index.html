<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>나린학원</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --paper:#FBF7F0; --ink:#33393D; --line:#E4DFD4; --muted:#8A9089;
    --seal:#D9534F; --navy:#3D6B9E; --absent:#A6ACA5; --card:#FFFFFF;
    --warn:#FFF3E0; --ok:#3A9B6E; --accent:#F2B33D;
    --r:16px; --shadow:0 3px 14px rgba(90,80,60,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Gowun Dodum','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    min-height:100vh; letter-spacing:-.1px;
  }
  h1,h2,h3,.nm,.clock,.jua{font-family:'Jua',sans-serif; font-weight:400; letter-spacing:.5px;}

  header{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    padding:20px 26px 16px;
  }
  header h1{font-size:27px; display:flex; align-items:center; gap:10px;}
  header h1 .badge{
    width:42px; height:42px; border-radius:12px; background:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); object-fit:contain; padding:3px;
    border:1.5px solid var(--line);
  }
  .clock{font-size:26px; text-align:center; color:var(--ink);}
  .clock small{font-size:15px; color:var(--muted); margin-left:2px;}
  header .date{font-size:15px; color:var(--muted); text-align:right;}

  nav{
    display:flex; gap:6px; background:#F1ECE2; border-radius:999px; padding:6px;
    margin:0 auto 6px; width:min(560px,92%);
  }
  nav button{
    flex:1; padding:12px 0; font-size:15.5px; background:none; border:none; cursor:pointer;
    color:var(--muted); border-radius:999px; font-family:'Gowun Dodum',sans-serif;
    transition:background .15s;
  }
  nav button.on{color:var(--ink); background:#fff; box-shadow:var(--shadow); font-weight:600;}
  main{padding:20px 22px 70px; max-width:1020px; margin:0 auto;}

  .missBox{
    background:var(--warn); border-radius:var(--r); box-shadow:var(--shadow);
    padding:16px 20px; margin-bottom:22px; line-height:2; font-size:15.5px;
  }
  .missBox b{font-family:'Jua',sans-serif; font-size:17px;}
  .missBox .ok{color:var(--ok); font-weight:600;}
  .missBox .miss{color:var(--seal); font-weight:700;}
  .missBox .later{color:var(--muted); font-size:13.5px;}

  .slotSec{margin-bottom:30px;}
  .slotHead{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; padding:0 2px;}
  .slotHead h2{font-size:21px;}
  .slotHead .cnt{font-size:14px; color:var(--muted);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
  .stu{
    position:relative; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow);
    padding:20px 12px 30px; cursor:pointer; text-align:center; min-height:118px;
    transition:transform .1s; border:2px solid transparent;
  }
  .stu:active{transform:scale(.95);}
  .stu .nm{font-size:21px; margin-bottom:8px;}
  .stu .st{font-size:13px; color:var(--muted); line-height:1.5;}
  .stu.notyet{border-color:#F0CFC5; background:#FFFBF8;}
  .stu.absent{background:#F0F1EE; box-shadow:none;}
  .stu.absent .nm{color:var(--absent); text-decoration:line-through;}
  .seal{
    position:absolute; top:8px; right:8px; width:38px; height:38px; border-radius:50%;
    border:2.5px solid var(--seal); color:var(--seal); font-size:13px;
    display:flex; align-items:center; justify-content:center; font-family:'Jua',sans-serif;
    transform:rotate(-12deg); background:rgba(217,83,79,.07);
    animation:stamp .18s ease-out;
  }
  .seal.out{border-color:var(--navy); color:var(--navy); background:rgba(61,107,158,.07); right:50px; transform:rotate(8deg);}
  @keyframes stamp{from{transform:rotate(-12deg) scale(1.8); opacity:0;} to{transform:rotate(-12deg) scale(1); opacity:1;}}
  .absBtn{
    position:absolute; bottom:8px; right:10px; font-size:12px; color:var(--muted);
    border:none; background:none; cursor:pointer; padding:5px 7px; font-family:inherit;
  }
  .absBtn:hover{color:var(--seal);}
  .clrTag{font-size:11px; color:#B8860B;}
  .searchInp{width:min(300px,100%);}
  .stu.extra{border-style:dashed; border-color:var(--line); background:#FCFBF7; box-shadow:none;}
  .tagExtra{position:absolute; top:8px; left:10px; font-size:11px; color:var(--navy);
    background:rgba(61,107,158,.08); border-radius:999px; padding:3px 8px;}

  .hint{font-size:13.5px; color:var(--muted); margin:16px 4px; line-height:1.8;}
  .empty{padding:70px 0; text-align:center; color:var(--muted); font-size:15.5px; line-height:2;}

  .row{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; align-items:center;}
  input[type=text],input[type=month],input[type=time],input[type=password],input[type=email]{
    padding:11px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:15.5px;
    font-family:inherit; background:#fff; color:var(--ink); outline-color:var(--accent);
  }
  .btn{
    padding:11px 18px; border:none; background:var(--ink); color:#fff;
    border-radius:12px; font-size:14.5px; cursor:pointer; font-family:inherit;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none;}
  .btn.danger{background:#fff; color:var(--seal); border:1.5px solid #EFC7C5; box-shadow:none;}
  .btn.small{padding:7px 12px; font-size:13px; border-radius:10px;}

  .dayPick{display:flex; gap:5px;}
  .dayPick button{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    font-size:14px; cursor:pointer; font-family:inherit; color:var(--muted);
  }
  .dayPick button.on{background:var(--navy); border-color:var(--navy); color:#fff;}

  .mgBox{background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;}
  .mgBox h3{font-size:19px; margin-bottom:12px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .mgBox h3 .sp{flex:1;}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line);
    border-radius:999px; padding:7px 10px 7px 15px; margin:4px 5px 4px 0; font-size:14.5px; background:#FDFCF9;}
  .chip small{color:var(--muted); font-size:12px;}
  .chip button{border:none; background:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 4px;}
  .chip button:hover{color:var(--seal);}

  .slotTabs{display:flex; gap:8px; flex-wrap:wrap;}
  .slotTabs button{
    padding:9px 20px; border:1.5px solid var(--line); background:#fff; border-radius:999px;
    font-size:14.5px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .slotTabs button.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  .tblWrap{overflow-x:auto; background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:4px;}
  table{border-collapse:collapse; font-size:13.5px; min-width:100%;}
  th,td{border:1px solid #EEE9DE; padding:8px 10px; text-align:center; white-space:nowrap;}
  th{background:#F7F4EC; font-weight:600;}
  td.p{color:var(--seal); font-weight:700; cursor:pointer;}
  td.a{color:var(--absent); cursor:pointer;}
  td.e{cursor:pointer;}
  td.e:hover,td.p:hover,td.a:hover{background:#FCF8EF;}
  tfoot td{background:#FAF8F2; font-weight:600;}
  .legend{font-size:13.5px; color:var(--muted); margin:12px 4px; line-height:1.8;}

  .lock{max-width:350px; margin:70px auto; text-align:center; background:#fff;
    border-radius:var(--r); box-shadow:var(--shadow); padding:30px 26px;}
  .lock h2{font-size:22px; margin-bottom:14px;}
  .lock p{font-size:14px; color:var(--muted); margin-bottom:18px; line-height:1.8;}
  .lock input{width:100%; text-align:center; margin-bottom:10px;}
  .lock .btn{width:100%;}

  .ovl{position:fixed; inset:0; background:rgba(40,40,35,.45); display:flex;
    align-items:flex-start; justify-content:center; z-index:50; padding:5vh 16px 16px;}
  .modal{background:#fff; border-radius:var(--r); padding:24px 26px; width:min(380px,92vw);
    box-shadow:0 12px 44px rgba(0,0,0,.22); max-height:85vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;}
  .modal p{font-size:15.5px; line-height:1.7; margin-bottom:16px;}
  .modal .mtitle{font-family:'Jua',sans-serif; font-size:19px; margin-bottom:14px;}
  .modal label{display:flex; align-items:center; gap:8px; font-size:14.5px; margin:10px 0;}
  .modal label span.lb{width:52px; color:var(--muted);}
  .modal input[type=time],.modal input[type=password],.modal input[type=text]{
    flex:1; padding:9px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit;}
  .modal input[type=checkbox]{width:18px; height:18px;}
  .modal .mrow{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}
  .netDot{position:fixed; bottom:14px; right:16px; font-size:12px; color:var(--muted);
    background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:5px 12px;}
  .netDot.off{color:var(--seal); border-color:#EFC7C5;}
</style>
</head>

function seoul(){
  const now=new Date();
  const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(now);
  const time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  const sec=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const wd=wdMap[new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(now)];
  return {date,time,sec,wd};
}
const todayStr=()=>seoul().date;
const nowTime=()=>seoul().time;
const monthKey=d=>'att-'+d.slice(0,7);
const fmtDays=days=>days.slice().sort().map(d=>DAYS[d]).join('');
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_STR='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function chosung(s){return [...String(s)].map(ch=>{const c=ch.charCodeAt(0);
  return (c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:ch;}).join('');}
function matchStudent(st,sl,qRaw){
  const q=(qRaw||'').trim(); if(!q)return true;
  if((st.name||'').includes(q))return true;
  if([...q].every(ch=>CHO_STR.includes(ch)) && chosung(st.name).includes(q))return true;
  if((st.school||'').includes(q))return true;
  const dq=q.replace(/\D/g,'');
  if(dq && (st.phone||'').includes(dq))return true;
  if(sl && (sl.name||'').includes(q))return true;
  return false;
}
function hmToMin(hm){const p=String(hm||'0:0').split(':').map(Number);return p[0]*60+p[1];}

let roster={slots:[]};

}

/* ---------- Firebase 시작 ---------- */
function startApp(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.includes('여기에')){
    $('#main').innerHTML=`<div class="lock"><h2>설정이 필요해요</h2>
      <p>index.html 파일 안의 <b>firebaseConfig</b> 부분에<br>
      Firebase 콘솔에서 복사한 설정을 붙여넣은 뒤<br>다시 업로드해 주세요.<br><br>
      (동봉된 README의 1~4단계를 참고하세요)</p></div>`;
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user){renderLogin(); return;}
    $('#mainNav').style.display='flex';
    $('#netDot').style.display='block';
    db.ref('.info/connected').on('value',s=>{
      const on=!!s.val();
      $('#netDot').textContent=on?'● 실시간 연결됨':'● 오프라인 — 저장 안 됨';
      $('#netDot').classList.toggle('off',!on);
    });
    // 명단 실시간 구독
    db.ref('data/roster2').on('value',snap=>{
      const v=snap.val();
      roster=v?JSON.parse(v):{slots:[]};
      if(view==='today')drawToday();
    });
    watchMonth(monthKey(todayStr()));
    render();
  });
}
function renderLogin(){
  $('#mainNav').style.display='none';
  $('#main').innerHTML=`<div class="lock"><h2>학원 계정 로그인</h2>
    <p>처음 한 번만 로그인하면<br>이 기기에서는 계속 로그인 상태가 유지됩니다.</p>

    <button class="btn" onclick="doLogin()">로그인</button></div>`;
}
async function doLogin(){
  try{
    await firebase.auth().signInWithEmailAndPassword($('#lgEmail').value.trim(),$('#lgPw').value);
  }catch(e){
    uiAlert('로그인에 실패했습니다.<br><small style="color:var(--muted)">이메일과 비밀번호를 확인해 주세요.</small>');
  }
}

/* ---------- 데이터 (Firebase 실시간) ---------- */
function watchMonth(mk){
  if(watched[mk])return;
  watched[mk]=true;
  db.ref('data/'+mk).on('value',snap=>{
    attCache[mk]=snap.val()||{};
    if(view==='today' && mk===monthKey(todayStr())) drawToday();
  });
}
async function fetchMonth(mk){
  if(attCache[mk]!==undefined && watched[mk]) return attCache[mk];
  const snap=await db.ref('data/'+mk).get();
  attCache[mk]=snap.val()||{};
  return attCache[mk];
}
async function saveRoster(){
  try{await db.ref('data/roster2').set(JSON.stringify(roster));}
  catch(e){uiAlert('저장에 실패했습니다. 인터넷 연결을 확인해 주세요.');}
}
async function applyRecAt(ds,sid,rec){
  const mk=monthKey(ds);
  const c=attCache[mk]=attCache[mk]||{}; c[ds]=c[ds]||{};
  if(rec===null){delete c[ds][sid]; if(!Object.keys(c[ds]).length) delete c[ds];}
  else c[ds][sid]=rec;
  if(view==='today') drawToday();
  try{
    const ref=db.ref('data/'+mk+'/'+ds+'/'+sid);
    if(rec===null) await ref.remove(); else await ref.set(rec);
  }catch(e){uiAlert('저장에 실패했습니다. 인터넷 연결을 확인해 주세요.');}
}
const slotById=id=>roster.slots.find(s=>s.id===id);
const sortedSlots=()=>roster.slots.slice().sort((a,b)=>a.time.localeCompare(b.time));
function findStudent(sid){
  for(const sl of roster.slots){const st=sl.students.find(s=>s.id===sid); if(st)return{sl,st};}
  return null;
}

/* ---------- 오늘 출석 ---------- */
function drawToday(){
  if(view!=='today')return;
  const m=$('#main');
  if(!roster.slots.length){
    m.innerHTML='<div class="empty">아직 등록된 시간대가 없습니다.<br>「시간대·학생 관리」에서 시간대와 학생을 먼저 추가해 주세요.</div>';
    return;
  }
  const s=seoul(); const date=s.date; const wd=s.wd; const nowHM=s.time;
  const nowMin=hmToMin(nowHM);
  const day=(attCache[monthKey(date)]||{})[date]||{};
  const slots=sortedSlots().map(sl=>({
    ...sl,
    today:sl.students,                                          // 보강 대응: 모든 학생을 매일 표시
    regular:sl.students.filter(st=>(st.days||[]).includes(wd))  // 오늘이 정규수업일인 학생
  })).filter(sl=>sl.today.length);

  if(!slots.length){
    m.innerHTML='<div class="empty">등록된 학생이 없습니다.<br>「시간대·학생 관리」에서 학생을 추가해 주세요.</div>';

  }
  const esc=(todaySearch||'').replace(/"/g,'&quot;');
  const searchBar=`<div class="row" style="margin-top:0">
    <input type="text" class="searchInp" placeholder="🔍 이름·초성·학교·번호·시간대 검색" value="${esc}"
      oninput="todaySearch=this.value;filterTodayCards()">
    <button class="btn ${showAllToday?'':'ghost'}" onclick="toggleAllToday()">${showAllToday?'👁 전체 보기 해제':'👁 관리자 전체 보기'}</button>
  </div>`;

  const started=slots.filter(sl=>sl.time<=nowHM && sl.regular.length);
  let miss='<div class="missBox"><b>📋 미등원 현황</b> <small style="color:var(--muted)">(정규수업 요일 기준)</small><br>';
  if(!started.length){
    miss+='<span class="later">아직 시작된 시간대가 없습니다. 수업 시작 시간이 지나면 여기에 표시됩니다.</span>';
  }else{
    started.forEach(sl=>{
      const not=sl.regular.filter(st=>{const r=day[st.id]||{}; return !r.in && r.status!=='a';});
      miss+=`${sl.name} <small style="color:var(--muted)">(${sl.time})</small> — `;
      miss+=not.length?`<span class="miss">${not.map(s=>s.name).join(', ')}</span>`:'<span class="ok">전원 등원 ✓</span>';
      miss+='<br>';
    });
    const pending=slots.filter(sl=>sl.time>nowHM && sl.regular.length);
    if(pending.length) miss+=`<span class="later">${pending.map(p=>p.name).join(', ')} 시간대는 시작 전입니다.</span>`;
  }
  miss+='</div>';

  let html=searchBar+miss;
  html+='<div class="empty" id="noneNow" style="display:none">지금은 출석 체크 시간대가 아닙니다.<br>위 검색창에서 이름·초성·학교·번호로 학생을 찾아 기록할 수 있어요.</div>';
  slots.forEach(sl=>{
    const winOn=Math.abs(nowMin-hmToMin(sl.time))<=15;   // 시간대 앞뒤 15분
    const regArrived=sl.regular.filter(st=>(day[st.id]||{}).in).length;
    const extraArrived=sl.today.filter(st=>!(st.days||[]).includes(wd)&&(day[st.id]||{}).in).length;
    const cnt=`${sl.time} · 정규 ${regArrived}/${sl.regular.length} 등원`+(extraArrived?` · 보강 ${extraArrived}명`:'');
    html+=`<section class="slotSec"><div class="slotHead">
      <h2>${sl.name}</h2><span class="cnt">${cnt}</span></div>
      <div class="grid">`+sl.today.map(st=>{
        const rec=day[st.id]||{};
        const isReg=(st.days||[]).includes(wd);
        let cls='stu', seals='', txt='탭하여 등원 기록';
        const tag=!isReg?'<span class="tagExtra">보강</span>':'';
        if(rec.status==='a'){cls+=' absent'; txt='결석';}
        else if(rec.out){seals='<span class="seal">출석</span><span class="seal out">하원</span>'; txt='등원 '+rec.in+' · 하원 '+rec.out;}
        else if(rec.in){seals='<span class="seal">출석</span>'; txt='등원 '+rec.in+'<br>탭하면 하원 기록';}
        else if(isReg){cls+=' notyet';}
        else{cls+=' extra'; txt='보강·추가 등원 시 탭';}
        return `<div class="${cls}" data-name="${st.name}" data-cho="${chosung(st.name)}" data-school="${st.school||''}" data-phone="${st.phone||''}" data-slot="${sl.name}" data-win="${winOn?'1':'0'}" onclick="tapStudent('${st.id}')">${tag}${seals}
          <div class="nm">${st.name}</div><div class="st">${txt}</div>
          <button class="absBtn" onclick="event.stopPropagation();toggleAbsent('${st.id}')">${rec.status==='a'?'결석 취소':'결석'}</button>
        </div>`;
      }).join('')+'</div></section>';
  });
  html+='<p class="hint">학생 카드는 시간대 시작 <b>앞뒤 15분</b> 동안 나타나며, 그 외 시간의 등원·하원 기록은 검색으로 학생을 찾아 진행합니다.<br>점선 카드는 오늘이 정규수업일이 아닌 학생(보강 등)으로, 출석 시 「보강」으로 집계되고 안 와도 미등원에 뜨지 않습니다.</p>';
  m.innerHTML=html;
  filterTodayCards();
}
function cardMatches(el,q){
  if((el.dataset.name||'').includes(q))return true;
  if([...q].every(ch=>CHO_STR.includes(ch)) && (el.dataset.cho||'').includes(q))return true;
  if((el.dataset.school||'')!=='' && el.dataset.school.includes(q))return true;
  const dq=q.replace(/\D/g,'');
  if(dq && (el.dataset.phone||'').includes(dq))return true;
  if((el.dataset.slot||'').includes(q))return true;
  return false;
}
function filterTodayCards(){
  const q=(todaySearch||'').trim();
  document.querySelectorAll('#main .stu').forEach(el=>{
    const show=q?cardMatches(el,q):(showAllToday||el.dataset.win==='1');
    el.style.display=show?'':'none';
  });
  let anyVisible=false;
  document.querySelectorAll('#main .slotSec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.stu')].some(el=>el.style.display!=='none');
    sec.style.display=any?'':'none';
    if(any)anyVisible=true;
  });
  const nn=$('#noneNow');
  if(nn)nn.style.display=(!anyVisible)?'':'none';
}
function renderToday(){
  watchMonth(monthKey(todayStr()));
  drawToday();
}
async function tapStudent(sid){
  const date=todayStr();
  const rec=((attCache[monthKey(date)]||{})[date]||{})[sid]||{};
  if(rec.status==='a')return;
  if(!rec.in) applyRecAt(date,sid,{...rec,in:nowTime()});
  else if(!rec.out) applyRecAt(date,sid,{...rec,out:nowTime()});
  else{
    if(await uiConfirm('이 학생의 오늘 기록을 지울까요?'))
      applyRecAt(date,sid,{cleared:true});
  }
}
async function toggleAbsent(sid){
  const date=todayStr();
  const rec=((attCache[monthKey(date)]||{})[date]||{})[sid]||{};
  if(rec.status==='a'){
    applyRecAt(date,sid, rec.cleared?{cleared:true}:null);
  }else{
    const nr={status:'a'}; if(rec.cleared)nr.cleared=true;
    applyRecAt(date,sid,nr);
  }
}

async function renderLog(){
  if(!adminUnlocked){renderLockGate();return;}

  if(!roster.slots.length){m.innerHTML='<div class="empty">등록된 시간대가 없습니다.</div>';return;}

function buildLogTable(){
  const wrap=$('#logTblWrap'); if(!wrap)return;
  const q=(logSearch||'').trim();
  const cols=logStudents().filter(c=>matchStudent(c.st,c.sl,q));
  const att=attCache['att-'+logMonth]||{};
  if(!cols.length){
    wrap.innerHTML='<div class="empty">검색된 학생이 없습니다.</div>'; return;
  }
  const [y,mo]=logMonth.split('-').map(Number);
  const dim=new Date(y,mo,0).getDate();
  const activeDates=[];
  for(let d=1;d<=dim;d++){
    const ds=logMonth+'-'+pad(d);
    if(att[ds] && cols.some(c=>att[ds][c.st.id])) activeDates.push(ds);
  }
  if(!activeDates.length){
    wrap.innerHTML='<div class="empty">이 달에는 기록이 없습니다.</div>'; return;
  }
  let thead;
  if(logSlot==='ALL' && !q){
    const slots=sortedSlots().filter(sl=>sl.students.length);
    thead='<thead><tr><th rowspan="2">날짜</th>'+
      slots.map(sl=>`<th colspan="${sl.students.length}">${sl.name}</th>`).join('')+'</tr><tr>'+
      cols.map(c=>'<th>'+c.st.name+'</th>').join('')+'</tr></thead>';
  }else{
    thead='<thead><tr><th>날짜</th>'+cols.map(c=>'<th>'+c.st.name+(logSlot==='ALL'?' <small style="color:var(--muted)">'+c.sl.name+'</small>':'')+'</th>').join('')+'</tr></thead>';
  }
  let tbl='<div class="tblWrap"><table>'+thead+'<tbody>';
  const cnt={};
  activeDates.forEach(ds=>{
    const day=att[ds]||{};
    const wd=DAYS[new Date(ds+'T12:00:00').getDay()];
    tbl+='<tr><th>'+ds.slice(5).replace('-','/')+' ('+wd+')</th>'+cols.map(c=>{
      const sid=c.st.id, r=day[sid];
      const click=`onclick="openRecEdit('${ds}','${sid}')"`;
      const clr=r&&r.cleared?'<br><span class="clrTag">✂ 지움기록</span>':'';
      if(!r) return `<td class="e" ${click}></td>`;
      if(r.status==='a') return `<td class="a" ${click}>✕${clr}</td>`;
      if(r.in){cnt[sid]=(cnt[sid]||0)+1;
        return `<td class="p" ${click} title="${r.in||''}${r.out?' ~ '+r.out:''}">○${clr}</td>`;}
      return `<td class="e" ${click}>${r.cleared?'<span class="clrTag">✂ 지움기록</span>':''}</td>`;
    }).join('')+'</tr>';
  });
  tbl+='</tbody><tfoot><tr><td>출석일</td>'+cols.map(c=>'<td>'+(cnt[c.st.id]||0)+'</td>').join('')+'</tr></tfoot></table></div>';
  tbl+=`<p class="legend">○ 출석 (칸에 마우스를 올리면 등·하원 시간) · ✕ 결석 · <span class="clrTag">✂ 지움기록</span>은 학생이 카드를 세 번 탭해 기록을 지운 적이 있다는 표시입니다.<br>
  칸을 누르면 등·하원 시간과 결석 여부를 직접 수정할 수 있습니다.</p>`;
  wrap.innerHTML=tbl;
}

    <div class="mrow">

      await applyRecAt(ds,sid,null); renderLog();

  };
  $('#edOk').onclick=async()=>{
    const nr={};
    if($('#edAbs').checked) nr.status='a';
    else{
      const i=$('#edIn').value, o=$('#edOut').value;
      if(i) nr.in=i;
      if(o){if(!i){uiAlert('하원 시간만 있을 수는 없어요. 등원 시간을 먼저 넣어 주세요.');return;} nr.out=o;}
    }
    if($('#edClr').checked) nr.cleared=true;
    $('#modalHost').innerHTML='';
    await applyRecAt(ds,sid,Object.keys(nr).length?nr:null); renderLog();
  };
}
async function exportCSV(){
  const q=(logSearch||'').trim();
  const cols=logStudents().filter(c=>matchStudent(c.st,c.sl,q));
  const att=await fetchMonth('att-'+logMonth);
  const [y,mo]=logMonth.split('-').map(Number);
  const dim=new Date(y,mo,0).getDate();
  let rows=[['날짜',...cols.map(c=>(logSlot==='ALL'?c.sl.name+'-':'')+c.st.name)]];
  for(let d=1;d<=dim;d++){
    const ds=logMonth+'-'+pad(d); const day=att[ds];
    if(!day || !cols.some(c=>day[c.st.id])) continue;
    rows.push([ds,...cols.map(c=>{
      const r=day[c.st.id]; if(!r)return'';
      let t='';
      if(r.status==='a')t='결석';
      else if(r.in)t='등원 '+r.in+(r.out?' / 하원 '+r.out:'');
      if(r.cleared)t+=(t?' ':'')+'(지움기록)';
      return t;
    })]);
  }
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  const nm=logSlot==='ALL'?'전체':slotById(logSlot).name;
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='나린학원출석부_'+nm+'_'+logMonth+'.csv'; a.click();
}

      <button onclick="event.stopPropagation();delStudent('${sl.id}','${st.id}')">✕</button></span>`).join('')||'<span class="hint">학생이 없습니다.</span>'}</div>
    <div class="row">
      <input type="text" id="ns-${sl.id}" placeholder="학생 이름 (쉼표로 여러 명)" style="width:200px">
      <input type="text" id="sc-${sl.id}" placeholder="학교 (선택)" style="width:110px">
      <input type="text" id="ph-${sl.id}" placeholder="휴대폰 뒷번호 (선택)" inputmode="numeric" style="width:150px">
      <span style="font-size:13px;color:var(--muted)">정규요일:</span>
      <div class="dayPick" id="dp-${sl.id}">${[1,2,3,4,5,6,0].map(d=>
        `<button class="${newDays.includes(d)?'on':''}" onclick="toggleDay('${sl.id}',${d},this)">${DAYS[d]}</button>`).join('')}</div>
      <button class="btn ghost" onclick="addStudents('${sl.id}')">학생 추가</button>
    </div>
  </div>`).join('');
  html+=`<p class="hint">학생 이름표를 누르면 이름·학교·뒷번호·정규요일을 수정할 수 있습니다.<br>요일 버튼은 <b>정규수업 요일</b>입니다. 모든 학생이 매일 「오늘 출석」에 나타나 보강 출석도 찍을 수 있고, 정규수업 요일에 안 온 학생만 미등원 현황에 표시됩니다.<br>
  요일을 하나도 고르지 않으면 '자유'로 등록되어 미등원 집계 없이 매일 출석만 찍을 수 있습니다.<br>
  다른 태블릿·컴퓨터에서도 이 주소로 접속해 같은 학원 계정으로 로그인하면 실시간으로 연동됩니다.</p>`;
  m.innerHTML=html;
}
function editSlot(id){
  const sl=slotById(id); if(!sl)return;
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal">
    <div class="mtitle">시간대 수정</div>
    <label><span class="lb">이름</span><input type="text" id="esName" value="${sl.name}"></label>
    <label><span class="lb">시간</span><input type="time" id="esTime" value="${sl.time}"></label>
    <div class="mrow"><button class="btn ghost" id="esNo">취소</button>
    <button class="btn" id="esOk">저장</button></div></div></div>`;
  $('#esNo').onclick=()=>$('#modalHost').innerHTML='';
  $('#esOk').onclick=async()=>{
    const nm=$('#esName').value.trim();
    if(!nm){uiAlert('이름을 입력해 주세요.');return;}
    sl.name=nm; sl.time=$('#esTime').value||sl.time;
    $('#modalHost').innerHTML='';
    await saveRoster(); renderManage();
  };
}
function toggleDay(slId,d,btn){
  btn.classList.toggle('on');
  const on=[...document.querySelectorAll('#dp-'+slId+' button.on')];
  const map={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
  newDays=on.map(b=>map[b.textContent]);
}
async function addSlot(){
  const nm=$('#newSlotName').value.trim(); const tm=$('#newSlotTime').value||'19:00';
  if(!nm)return;
  roster.slots.push({id:'g'+Date.now(),name:nm,time:tm,students:[]});
  await saveRoster(); renderManage();
}
async function delSlot(id){
  const sl=slotById(id);
  if(!await uiConfirm('「'+sl.name+'」 시간대를 삭제할까요?<br><small style="color:var(--muted)">지난 출석 기록 자체는 남습니다.</small>'))return;
  roster.slots=roster.slots.filter(x=>x.id!==id);
  await saveRoster(); renderManage();
}
async function addStudents(slId){
  const inp=$('#ns-'+slId); const names=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!names.length)return;
  const days=newDays.slice();   // 요일을 하나도 안 고르면 '자유'(정규수업일 없음)로 등록됨
  const school=($('#sc-'+slId).value||'').trim();
  const phone=($('#ph-'+slId).value||'').replace(/\D/g,'');
  const sl=slotById(slId);
  names.forEach((n,i)=>{
    const st={id:'s'+Date.now()+'_'+i,name:n,days:days};
    if(school)st.school=school;
    if(phone)st.phone=phone;
    sl.students.push(st);
  });
  await saveRoster(); renderManage();
}
function editStudent(slId,sid){
  const sl=slotById(slId); if(!sl)return;
  const st=sl.students.find(x=>x.id===sid); if(!st)return;
  const dayBtns=[1,2,3,4,5,6,0].map(d=>
    `<button type="button" class="${(st.days||[]).includes(d)?'on':''}" onclick="this.classList.toggle('on')">${DAYS[d]}</button>`).join('');
  $('#modalHost').innerHTML=`<div class="ovl"><div class="modal">
    <div class="mtitle">학생 정보 수정</div>
    <label><span class="lb">이름</span><input type="text" id="edStNm" value="${st.name}"></label>
    <label><span class="lb">학교</span><input type="text" id="edStSc" value="${st.school||''}" placeholder="선택"></label>
    <label><span class="lb">뒷번호</span><input type="text" id="edStPh" value="${st.phone||''}" placeholder="선택" inputmode="numeric"></label>
    <label><span class="lb">정규요일</span></label>
    <div class="dayPick" id="edDp">${dayBtns}</div>
    <div class="mrow"><button class="btn ghost" id="edStNo">취소</button>
    <button class="btn" id="edStOk">저장</button></div></div></div>`;
  $('#edStNo').onclick=()=>$('#modalHost').innerHTML='';
  $('#edStOk').onclick=async()=>{
    const nm=$('#edStNm').value.trim();
    if(!nm){uiAlert('이름을 입력해 주세요.');return;}
    st.name=nm;
    const sc=$('#edStSc').value.trim(); if(sc)st.school=sc; else delete st.school;
    const ph=$('#edStPh').value.replace(/\D/g,''); if(ph)st.phone=ph; else delete st.phone;
    const map={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
    st.days=[...document.querySelectorAll('#edDp button.on')].map(b=>map[b.textContent]);
    $('#modalHost').innerHTML='';
    await saveRoster(); renderManage();
  };
}
async function delStudent(slId,sid){
  const sl=slotById(slId);
  if(!await uiConfirm('이 학생을 명단에서 삭제할까요?'))return;
  sl.students=sl.students.filter(s=>s.id!==sid);
  await saveRoster(); renderManage();
}

/* ---------- 공통 ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); view=b.dataset.v; render();
});
function render(){
  if(view==='today')renderToday();
  else if(view==='log')renderLog();
  else renderManage();
}
(function(){
  const s=seoul();
  const d=s.date.split('-');
  $('#todayLabel').textContent=d[0]+'년 '+Number(d[1])+'월 '+Number(d[2])+'일 ('+DAYS[s.wd]+')';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  startApp();
})();
</script>
